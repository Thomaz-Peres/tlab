services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file: ../.env
    ports:
      - 3000:3000
    volumes:
      - ./config/:/app/config
      - ./config/images:/app/public/images
    restart: unless-stopped
    networks:
      - homepage
      - dockerproxy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - HOMEPAGE_ALLOWED_HOSTS=${HOSTS}
      - TZ=${TZ}

networks:
  homepage:
  dockerproxy:
    internal: true
